<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail-Proxy — Review</title>
  <link rel="stylesheet" href="/assets/hitl.css">
</head>
<body>
<script type="application/json" id="payload-data">{{PAYLOAD_JSON}}</script>
<script type="text/plain" id="hitl-account-email" style="display:none">{{ACCOUNT_EMAIL}}</script>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">✉ Mail-Proxy · Review</h1>
    <p class="hitl-subtitle">{{FUNC_NAME}}</p>
    <div id="account-badge"></div>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve</button>
  </div>
</header>

<main class="hitl-container">
  <section class="hitl-card" id="uid-resolution-card" style="display:none">
    <h2>🔍 Messages Impactés <span class="field-label">resolved UIDs</span></h2>
    <div class="hitl-card-body">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="background:#1a1a2e;color:#fff;">
            <th style="padding:8px;text-align:left;">UID</th>
            <th style="padding:8px;text-align:left;">From</th>
            <th style="padding:8px;text-align:left;">Subject</th>
            <th style="padding:8px;text-align:left;">Date</th>
            <th style="padding:8px;text-align:left;">Folder</th>
          </tr>
        </thead>
        <tbody id="uid-resolution-body"></tbody>
      </table>
    </div>
  </section>

  <section class="hitl-card">
    <h2>📋 Action JSON <span class="field-label">editable · this complete object is submitted</span></h2>
    <div class="hitl-card-body">
      <textarea class="hitl-input" id="payload" rows="18"></textarea>
    </div>
  </section>
</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional)" rows="2"></textarea>
</footer>

<script>
var ORIGINAL, payload;
try {
  payload = JSON.parse(document.getElementById('payload-data').textContent);
  ORIGINAL = JSON.parse(JSON.stringify(payload));
} catch(e) {
  payload = {};
  ORIGINAL = {};
}
document.getElementById('payload').value = JSON.stringify(payload, null, 2);
if (payload.account_id || document.getElementById('hitl-account-email').textContent) {
  var email = document.getElementById('hitl-account-email').textContent;
  var label = payload.account_id + (email ? ' — ' + email : '');
  document.getElementById('account-badge').innerHTML =
    '<span style="background:#0f3460;color:#e2e8f0;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:0.5px">📧 ' +
    label + '</span>';
}
if (payload._uid_resolution && Object.keys(payload._uid_resolution).length > 0) {
  var card = document.getElementById('uid-resolution-card');
  var tbody = document.getElementById('uid-resolution-body');
  card.style.display = '';
  Object.keys(payload._uid_resolution).forEach(function(uid) {
    var r = payload._uid_resolution[uid];
    var tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid var(--border)';
    tr.innerHTML = '<td style="padding:8px;font-weight:600;">' + uid + '</td>' +
      '<td style="padding:8px;">' + (r.from || '') + '</td>' +
      '<td style="padding:8px;">' + (r.subject || '') + '</td>' +
      '<td style="padding:8px;font-size:12px;color:#888;">' + (r.date || '') + '</td>' +
      '<td style="padding:8px;font-size:12px;color:#888;">' + (r.folder || '') + '</td>';
    tbody.appendChild(tr);
  });
}

async function submit(s) {
  var raw = document.getElementById('payload').value;
  var p;
  try { p = JSON.parse(raw); } catch(e) { p = raw; }
  var c = document.getElementById('comment').value;
  var edited = JSON.stringify(p) !== JSON.stringify(ORIGINAL);
  var r = await fetch('/submit', {
    method: 'POST',
    body: JSON.stringify({
      id: '{{REQUEST_ID}}',
      status: s,
      comment: c,
      payload: p,
      edited: edited
    })
  });
  if (r.ok) {
    document.body.innerHTML = '<div class="hitl-done"><h2>' +
      (s === 'approved' ? '✅ APPROVED' : '❌ REJECTED') +
      '</h2></div>';
    setTimeout(() => window.close(), 800);
  }
}
</script>
</body>
</html>
