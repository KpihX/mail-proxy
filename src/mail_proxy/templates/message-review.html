<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail-Proxy · Compose Review</title>
  <link rel="stylesheet" href="/assets/hitl.css">
  <style>
    .email-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .email-field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .email-field input, .email-field textarea {
      background: #080d18; border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font: 14px/1.4 inherit; padding: 8px 10px; width: 100%;
    }
    .email-field input:focus, .email-field textarea:focus { border-color: var(--accent); outline: none; }
    .email-field textarea.body-input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 180px; resize: vertical; }
    .email-field textarea.html-input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 100px; resize: vertical; }
    .sig-zone {
      border: 2px solid var(--accent); border-radius: 10px; padding: 14px;
      background: var(--surface-raised); margin: 14px 0;
    }
    .sig-zone h3 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
    .sig-zone .sig-rendered {
      background: #080d18; border: 1px solid var(--border); border-radius: 7px;
      padding: 12px; min-height: 40px; font-size: 13px; line-height: 1.5;
    }
    .sig-zone .sig-empty { color: var(--muted); font-style: italic; }
    .attach-list { list-style: none; padding: 0; margin: 0; }
    .attach-list li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .attach-list li:last-child { border-bottom: none; }
    .raw-toggle { color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; margin-top: 8px; display: inline-block; }
  </style>
</head>
<body>
<script type="application/json" id="payload-data">{{PAYLOAD_JSON}}</script>
<script type="text/plain" id="hitl-account-email" style="display:none">{{ACCOUNT_EMAIL}}</script>
<script type="text/plain" id="hitl-resolved-sig" style="display:none">{{RESOLVED_SIG_HTML}}</script>
<script type="application/json" id="hitl-original-msg" style="display:none">{{ORIGINAL_MSG_JSON}}</script>
<script type="application/json" id="hitl-default-subject" style="display:none">{{DEFAULT_SUBJECT_JSON}}</script>

<header class="hitl-header">
  <div>
    <h1 class="hitl-brand">✉ Mail-Proxy · Compose Review</h1>
    <p class="hitl-subtitle">{{FUNC_NAME}}</p>
    <div id="account-badge"></div>
  </div>
  <div class="hitl-actions">
    <button class="hitl-button hitl-reject" onclick="submit('rejected')">✕ Reject</button>
    <button class="hitl-button hitl-approve" onclick="submit('approved')">✓ Approve</button>
  </div>
</header>

<main class="hitl-container">
  <!-- Original message being replied to / forwarded -->
  <div id="original-msg-card"></div>

  <!-- Email fields -->
  <section class="hitl-card">
    <h2>📧 Email Fields <span class="field-label">editable</span></h2>
    <div class="hitl-card-body">
      <div class="email-field">
        <label>To <span id="to-hint" style="text-transform:none;font-weight:400;opacity:.6"></span></label>
        <input type="text" id="field-to" placeholder="recipient@example.com">
      </div>
      <div class="email-field">
        <label>CC</label>
        <input type="text" id="field-cc" placeholder="cc@example.com (optional)">
      </div>
      <div class="email-field">
        <label>BCC</label>
        <input type="text" id="field-bcc" placeholder="bcc@example.com (optional)">
      </div>
      <div class="email-field">
        <label>Subject <span id="subject-hint" style="text-transform:none;font-weight:400;opacity:.6"></span></label>
        <input type="text" id="field-subject" placeholder="Subject line">
      </div>
    </div>
  </section>

  <!-- Body -->
  <section class="hitl-card">
    <h2>📝 Body <span class="field-label">plain text · editable</span></h2>
    <div class="hitl-card-body">
      <div class="email-field">
        <textarea class="body-input" id="field-body" placeholder="Message body…"></textarea>
      </div>
    </div>
  </section>

  <!-- HTML Body -->
  <section class="hitl-card" id="html-body-card">
    <h2>🌐 HTML Body <span class="field-label">optional · editable</span></h2>
    <div class="hitl-card-body">
      <div class="email-field">
        <label>HTML source</label>
        <textarea class="body-input html-input" id="field-html" placeholder="&lt;p&gt;HTML body…&lt;/p&gt;"></textarea>
      </div>
      <div class="email-field">
        <label>Preview</label>
        <div id="html-preview" style="background:#fff;border:1px solid var(--border);border-radius:7px;padding:16px;min-height:80px;color:#1a1a2e;font-size:14px;"></div>
      </div>
    </div>
  </section>

  <!-- Signature zone -->
  <section class="sig-zone" id="sig-zone">
    <h3>✍ Signature</h3>
    <div class="sig-rendered" id="sig-rendered"></div>
  </section>

  <!-- Attachments -->
  <section class="hitl-card" id="attachments-card" style="display:none">
    <h2>📎 Attachments <span class="field-label" id="attach-count"></span></h2>
    <div class="hitl-card-body">
      <ul class="attach-list" id="attach-list"></ul>
    </div>
  </section>

  <!-- Raw JSON -->
  <section class="hitl-card">
    <h2>📋 Raw JSON <span class="field-label">editable · this complete object is submitted</span></h2>
    <div class="hitl-card-body">
      <span class="raw-toggle" onclick="toggleRaw()">Show/hide raw JSON</span>
      <textarea class="hitl-input" id="payload" rows="18" style="display:none;margin-top:10px"></textarea>
    </div>
  </section>
</main>

<footer class="hitl-footer">
  <textarea class="hitl-input" id="comment" placeholder="Comment (optional)" rows="2"></textarea>
</footer>

<script>
var ORIGINAL, payload;
try {
  payload = JSON.parse(document.getElementById('payload-data').textContent);
  ORIGINAL = JSON.parse(JSON.stringify(payload));
} catch(e) {
  payload = {};
  ORIGINAL = {};
}
if (payload.account_id || document.getElementById('hitl-account-email').textContent) {
  var email = document.getElementById('hitl-account-email').textContent;
  var label = payload.account_id + (email ? ' — ' + email : '');
  document.getElementById('account-badge').innerHTML =
    '<span style="background:#0f3460;color:#e2e8f0;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:0.5px">📧 ' +
    label + '</span>';
}

// reply/forward never carry `subject` in their own payload (it is computed
// server-side AFTER approval) — track this once, from the ORIGINAL payload,
// so an edited value round-trips as `subject_override` instead of being
// silently dropped by Pydantic on an unknown `subject` key.
var usesSubjectOverride = !('subject' in payload);
var originalMsg = JSON.parse(document.getElementById('hitl-original-msg').textContent || '{}');
var defaultSubject = JSON.parse(document.getElementById('hitl-default-subject').textContent || '""');
if (originalMsg.verb) {
  var originalCard = document.getElementById('original-msg-card');
  var originalDetails = document.createElement('div');
  originalDetails.style.cssText = 'background:#0f3460;border-radius:8px;padding:12px 16px;margin-bottom:14px;color:#e2e8f0;font-size:13px;line-height:1.6;';
  originalDetails.textContent = originalMsg.verb + ': ' + originalMsg.from + '\nSubject: ' + originalMsg.subject + '\nDate: ' + originalMsg.date + ' · Folder: ' + originalMsg.folder;
  originalDetails.style.whiteSpace = 'pre-line';
  originalCard.appendChild(originalDetails);
}

// Populate email fields from payload
function populateFields() {
  document.getElementById('field-to').value = listToStr(payload.to);
  document.getElementById('field-cc').value = listToStr(payload.cc);
  document.getElementById('field-bcc').value = listToStr(payload.bcc);
  var subjectValue = usesSubjectOverride
    ? (payload.subject_override || defaultSubject || '')
    : (payload.subject || '');
  document.getElementById('field-subject').value = subjectValue;
  if (usesSubjectOverride) {
    document.getElementById('subject-hint').textContent = '(auto "Re:/Fwd:" — adjustable)';
  }
  if (!('to' in payload)) {
    document.getElementById('to-hint').textContent = '(auto-resolved from sender/reply-all)';
  }
  document.getElementById('field-body').value = payload.body_text || '';
  document.getElementById('field-html').value = payload.body_html || '';
  renderHtmlPreview();
  renderSignature(payload.signature || 'default');
  renderAttachments(payload.attachments);
}

function listToStr(v) {
  if (!v) return '';
  if (Array.isArray(v)) return v.join(', ');
  return String(v);
}

function strToList(s) {
  if (!s || !s.trim()) return null;
  return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
}

function renderSignature(sig) {
  var el = document.getElementById('sig-rendered');
  var resolved = document.getElementById('hitl-resolved-sig').textContent;
  if (resolved && resolved.trim()) {
    el.innerHTML = '<div style="border-top:1px solid #ccc;padding-top:8px;">' + resolved + '</div>';
  } else {
    el.innerHTML = '';
  }
}

function renderAttachments(files) {
  var card = document.getElementById('attachments-card');
  var list = document.getElementById('attach-list');
  var count = document.getElementById('attach-count');
  if (!files || files.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  count.textContent = files.length + ' file(s)';
  list.innerHTML = '';
  for (var i = 0; i < files.length; i++) {
    var li = document.createElement('li');
    li.textContent = files[i];
    list.appendChild(li);
  }
}

function gatherPayload() {
  var p = JSON.parse(JSON.stringify(ORIGINAL));
  var to = strToList(document.getElementById('field-to').value);
  if (to) p.to = to;
  var cc = strToList(document.getElementById('field-cc').value);
  p.cc = cc;
  var bcc = strToList(document.getElementById('field-bcc').value);
  p.bcc = bcc;
  var subj = document.getElementById('field-subject').value.trim();
  if (subj) {
    if (usesSubjectOverride) {
      p.subject_override = subj;
    } else {
      p.subject = subj;
    }
  }
  var body = document.getElementById('field-body').value;
  p.body_text = body;
  var html = document.getElementById('field-html').value;
  p.body_html = html;
  return p;
}

function toggleRaw() {
  var el = document.getElementById('payload');
  if (el.style.display === 'none') {
    el.value = JSON.stringify(gatherPayload(), null, 2);
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

document.getElementById('field-to').addEventListener('input', function() {
  payload.to = strToList(this.value);
});
document.getElementById('field-cc').addEventListener('input', function() {
  payload.cc = strToList(this.value);
});
document.getElementById('field-bcc').addEventListener('input', function() {
  payload.bcc = strToList(this.value);
});
document.getElementById('field-subject').addEventListener('input', function() {
  if (usesSubjectOverride) {
    payload.subject_override = this.value;
  } else {
    payload.subject = this.value;
  }
});
document.getElementById('field-body').addEventListener('input', function() {
  payload.body_text = this.value;
});
document.getElementById('field-html').addEventListener('input', function() {
  payload.body_html = this.value;
  renderHtmlPreview();
});

function renderHtmlPreview() {
  var el = document.getElementById('html-preview');
  var html = document.getElementById('field-html').value;
  if (!html || !html.trim()) {
    el.innerHTML = '<em style="color:#888">No HTML body — plain text only</em>';
  } else {
    el.innerHTML = html;
  }
}

populateFields();

async function submit(s) {
  var p = gatherPayload();
  var c = document.getElementById('comment').value;
  var edited = JSON.stringify(p) !== JSON.stringify(ORIGINAL);
  var r = await fetch('/submit', {
    method: 'POST',
    body: JSON.stringify({
      id: '{{REQUEST_ID}}',
      status: s,
      comment: c,
      payload: p,
      edited: edited
    })
  });
  if (r.ok) {
    document.body.innerHTML = '<div class="hitl-done"><h2>' +
      (s === 'approved' ? '✅ APPROVED' : '❌ REJECTED') +
      '</h2></div>';
    setTimeout(() => window.close(), 800);
  }
}
</script>
</body>
</html>
